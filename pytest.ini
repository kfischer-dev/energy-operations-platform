[pytest]
markers =
    post: tests for POST endpoints
    patch: tests for PATCH endpoints
    kpi: tests for KPI and analytics endpoints
    validation: tests for request and path validation
    time_grid: tests for time grids
    sim_profiles: tests for simulation profiles
    simulation: tests for simulation functions
    aggregation: tests for aggregation functions
    intermediate: intermediate markers for test categorization
    unit: unit tests
    integration: integration tests
    repository: tests for repository functions
    service: tests for service functions